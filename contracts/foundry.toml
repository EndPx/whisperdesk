[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.25"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
# Read-only access for GoldenVectors.t.sol, which loads the Go<->Solidity parity fixture
# generated by extension/matcher/cmd/genvectors (docs/design.md §3.5/§6.3, Step 4 DoD).
fs_permissions = [{ access = "read", path = "./test/vectors" }]

[rpc_endpoints]
coston2 = "https://coston2-api.flare.network/ext/C/rpc"
