name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

  # Ditambahkan saat komponennya lahir:
  # - go-engine (go test ./...) — Step 4
  # - vectors-parity (vitest golden vectors + ABI drift) — Step 4
  # - web (lint + typecheck) — Step 6
